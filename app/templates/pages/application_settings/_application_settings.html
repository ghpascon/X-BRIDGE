<div x-data="applicationSettings()" x-init="init()">
  <div class="bg-white rounded-2xl shadow-lg p-6">
    <div class="mb-4">
      <h2 class="text-xl font-bold text-gray-900 mb-1">
        Application Configuration
      </h2>
      <p class="text-sm text-gray-600">
        Configure general application settings and behavior
      </p>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="flex justify-center items-center py-8">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500"></div>
    </div>

    <!-- Settings Form grouped by type -->
    <form x-show="!loading" @submit.prevent="saveSettings()" x-cloak>
      <div class="space-y-4">
        <!-- Booleans -->
        <div x-show="groups.bools.length > 0">
          <h3 class="text-sm font-medium text-gray-700 mb-2">Toggles</h3>
          <div class="grid grid-cols-1 gap-3">
            <template x-for="key in groups.bools" :key="key">
              <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                <div class="text-sm font-medium text-gray-700" x-text="formatLabel(key)"></div>
                <div class="flex items-center space-x-2">
                  <button type="button" @click="applyExample(key)" x-show="examples[key] !== undefined"
                    class="text-xs text-purple-600 hover:text-purple-700 font-medium" title="Use example value">
                    Example
                  </button>
                  <button type="button" @click="settings[key] = !settings[key]"
                    :class="settings[key] ? 'bg-blue-600' : 'bg-gray-300'"
                    class="relative inline-flex h-5 w-9 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    <span :class="settings[key] ? 'translate-x-4' : 'translate-x-0'"
                      class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Numbers -->
        <div x-show="groups.numbers.length > 0">
          <h3 class="text-sm font-medium text-gray-700 mb-2">Numbers</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <template x-for="key in groups.numbers" :key="key">
              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1" x-text="formatLabel(key)"></label>
                <div class="flex space-x-2">
                  <input type="text" x-model="settings[key]" @input="handleNumberInput($event, key)" inputmode="decimal"
                    step="any" pattern="^[+-]?\\d+([.,]\\d+)?$"
                    class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
                  <button type="button" @click="applyExample(key)" x-show="examples[key] !== undefined"
                    class="px-3 py-2 text-xs bg-purple-50 text-purple-600 hover:bg-purple-100 rounded-lg transition-colors font-medium">
                    Ex
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Strings -->
        <div x-show="groups.strings.length > 0">
          <h3 class="text-sm font-medium text-gray-700 mb-2">Text</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <template x-for="key in groups.strings" :key="key">
              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1" x-text="formatLabel(key)"></label>
                <div class="flex space-x-2">
                  <input type="text" x-model="settings[key]"
                    class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
                  <button type="button" @click="applyExample(key)"
                    x-show="examples[key] !== undefined && examples[key] !== null && examples[key] !== ''"
                    class="px-3 py-2 text-xs bg-purple-50 text-purple-600 hover:bg-purple-100 rounded-lg transition-colors font-medium">
                    Ex
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- JSON (arrays & objects) -->
        <div x-show="(groups.arrays.length + groups.objects.length) > 0">
          <h3 class="text-sm font-medium text-gray-700 mb-2">JSON</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <template x-for="key in [...groups.arrays, ...groups.objects]" :key="key">
              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1" x-text="formatLabel(key)"></label>
                <div class="flex space-x-2">
                  <textarea x-model="jsonEditors[key]" rows="6"
                    class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"></textarea>
                  <div class="flex flex-col space-y-2">
                    <button type="button" @click="applyExample(key)" x-show="examples[key] !== undefined"
                      class="px-3 py-2 text-xs bg-purple-50 text-purple-600 hover:bg-purple-100 rounded-lg transition-colors font-medium">
                      Ex
                    </button>
                    <button type="button" @click="prettifyJson(key)"
                      class="px-3 py-2 text-xs border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                      Fmt
                    </button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Others -->
        <div x-show="groups.others.length > 0">
          <h3 class="text-sm font-medium text-gray-700 mb-2">Other</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <template x-for="key in groups.others" :key="key">
              <div>
                <label class="block text-xs font-medium text-gray-700 mb-1" x-text="formatLabel(key)"></label>
                <div class="flex space-x-2">
                  <input type="text" x-model="settings[key]"
                    class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
                  <button type="button" @click="applyExample(key)"
                    x-show="examples[key] !== undefined && examples[key] !== null && examples[key] !== ''"
                    class="px-3 py-2 text-xs bg-purple-50 text-purple-600 hover:bg-purple-100 rounded-lg transition-colors font-medium">
                    Ex
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between items-center mt-6 pt-4 border-t">
        <button type="button" @click="loadExamples(true)"
          class="px-4 py-2 text-sm bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors"
          title="Load all example values">
          Load All Examples
        </button>
        <div class="flex space-x-3">
          <button type="button" @click="loadSettings()"
            class="px-4 py-2 text-sm border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
            Reset
          </button>
          <button type="submit" :disabled="saving"
            class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            <span x-show="!saving">Save Settings</span>
            <span x-show="saving">Saving...</span>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  function applicationSettings() {
    return {
      settings: {},
      examples: {},
      loading: false,
      saving: false,
      // store JSON editor text for array/object keys
      jsonEditors: {},
      groups: { bools: [], numbers: [], strings: [], arrays: [], objects: [], others: [] },

      // Parse a localized number string (accepts comma or dot) -> Number or null
      parseLocalizedNumber(val) {
        if (val === null || val === undefined) return null;
        if (typeof val === 'number') return val;
        let s = String(val).trim();
        if (s === '') return null;
        // remove whitespace and convert comma decimal separator to dot
        s = s.replace(/\s+/g, '');
        s = s.replace(/,/g, '.');
        const n = Number(s);
        return Number.isFinite(n) ? n : null;
      },

      // Normalize input for numeric fields (allows comma or dot)
      handleNumberInput(event, key) {
        const raw = event.target.value;
        const normalized = String(raw).replace(/,/g, '.').trim();
        if (normalized === '') {
          this.settings[key] = '';
          return;
        }
        // Accept simple decimal numbers like -12.34 or 123
        if (/^[+-]?\d+(?:\.\d+)?$/.test(normalized)) {
          const n = parseFloat(normalized);
          if (!Number.isNaN(n)) {
            this.settings[key] = n;
            // ensure the input shows the normalized form (dot as decimal separator)
            event.target.value = String(normalized);
            return;
          }
        }
        // fallback: keep raw value while the user types
        this.settings[key] = raw;
      },

      async init() {
        await this.loadSettings();
        await this.loadExamples();
      },

      buildGroups() {
        const g = { bools: [], numbers: [], strings: [], arrays: [], objects: [], others: [] };
        const keys = new Set([
          ...Object.keys(this.settings || {}),
          ...Object.keys(this.examples || {}),
        ]);

        const jsonKeys = [];

        for (const k of keys) {
          const v = this.settings ? this.settings[k] : undefined;
          const ex = this.examples ? this.examples[k] : undefined;
          let t = null;

          // Prefer real typed values, but if string contains a JSON array/object, detect it
          const detectFrom = (v !== null && v !== undefined) ? v : ex;

          if (detectFrom !== null && detectFrom !== undefined) {
            if (Array.isArray(detectFrom)) t = 'array';
            else if (detectFrom !== null && typeof detectFrom === 'object') t = 'object';
            else if (typeof detectFrom === 'string') {
              const s = detectFrom.trim();
              if (s === 'null' || s === 'None') {
                // treat explicit null as others (will be converted on save)
                t = 'others';
              } else if (s.startsWith('[') || s.startsWith('{')) {
                try {
                  const parsed = JSON.parse(s);
                  if (Array.isArray(parsed)) {
                    t = 'array';
                    // store pretty JSON for editor
                    this.jsonEditors[k] = JSON.stringify(parsed, null, 2);
                  } else if (parsed !== null && typeof parsed === 'object') {
                    t = 'object';
                    this.jsonEditors[k] = JSON.stringify(parsed, null, 2);
                  } else {
                    t = 'string';
                  }
                } catch (e) {
                  t = 'string';
                }
              } else {
                // detect numeric strings (allow comma or dot as decimal separator)
                const candidate = s.replace(/\s+/g, '');
                if (/^[+-]?\d+([.,]\d+)?$/.test(candidate)) {
                  t = 'number';
                  // convert setting to actual Number so inputs show numeric value
                  try {
                    const parsedNum = this.parseLocalizedNumber(candidate);
                    if (parsedNum !== null) {
                      if (!this.settings) this.settings = {};
                      this.settings[k] = parsedNum;
                    }
                  } catch (e) {
                    // ignore
                  }
                } else {
                  t = 'string';
                }
              }
            } else {
              t = typeof detectFrom;
            }
          }

          if (t === 'boolean') g.bools.push(k);
          else if (t === 'number') g.numbers.push(k);
          else if (t === 'string') g.strings.push(k);
          else if (t === 'array') { g.arrays.push(k); jsonKeys.push(k); }
          else if (t === 'object') { g.objects.push(k); jsonKeys.push(k); }
          else g.others.push(k);
        }

        // initialize json editor strings for arrays/objects (from real objects, not just parsed strings)
        for (const key of jsonKeys) {
          if (this.jsonEditors && this.jsonEditors[key] !== undefined) continue;
          const val = (this.settings && this.settings[key] !== undefined) ? this.settings[key] : (this.examples && this.examples[key] !== undefined ? this.examples[key] : null);
          try {
            // if val is a string that looks like JSON, parse first
            if (typeof val === 'string') {
              const s = val.trim();
              if (s.startsWith('{') || s.startsWith('[')) {
                const parsed = JSON.parse(s);
                this.jsonEditors[key] = JSON.stringify(parsed, null, 2);
                continue;
              }
            }
            this.jsonEditors[key] = JSON.stringify(val, null, 2);
          } catch (e) {
            this.jsonEditors[key] = '';
          }
        }

        // remove stale jsonEditors entries
        for (const k in (this.jsonEditors || {})) {
          if (!jsonKeys.includes(k)) delete this.jsonEditors[k];
        }

        this.groups = g;
      },

      applyExample(key) {
        if (this.examples && this.examples[key] !== undefined) {
          // if it's array/object, update the json editor text as well
          this.settings[key] = this.examples[key];
          if (Array.isArray(this.examples[key]) || (this.examples[key] !== null && typeof this.examples[key] === 'object')) {
            try {
              this.jsonEditors[key] = JSON.stringify(this.examples[key], null, 2);
            } catch (e) {
              this.jsonEditors[key] = '';
            }
          }
        }
      },

      async loadSettings() {
        this.loading = true;
        try {
          const response = await fetch('{{ url_for("get_current_settings") }}');
          const data = await response.json();
          this.settings = data || {};
          this.buildGroups();
        } catch (error) {
          showAlert("Error loading settings", "error", 5000);
          console.error("Error loading settings:", error);
        } finally {
          this.loading = false;
        }
      },

      async loadExamples(applyToSettings = false) {
        try {
          const response = await fetch(
            '{{ url_for("get_application_config_example") }}',
          );
          const data = await response.json();
          this.examples = data || {};

          if (applyToSettings) {
            this.settings = { ...this.settings, ...this.examples };
            showAlert("Example values loaded", "success", 3000);
          }

          // Rebuild groups after examples are available so types can be inferred from examples
          this.buildGroups();
        } catch (error) {
          console.error("Error loading examples:", error);
        }
      },

      async saveSettings() {
        this.saving = true;
        try {
          // sync JSON editor strings into settings objects/arrays
          for (const k in (this.jsonEditors || {})) {
            const txt = this.jsonEditors[k];
            if (txt === null || txt === undefined || txt === '') {
              this.settings[k] = null;
              continue;
            }
            try {
              this.settings[k] = JSON.parse(txt);
            } catch (err) {
              showAlert("Invalid JSON for " + this.formatLabel(k), "error", 5000);
              this.saving = false;
              return;
            }
          }

          // attempt to parse flexible string fields (strings that may contain JSON, null, booleans)
          const tryParseFlexible = (val) => {
            if (val === null || val === undefined) return val;
            if (typeof val !== 'string') return val;
            const s = val.trim();
            if (s === '') return val; // keep empty string
            if (s === 'null' || s === 'None') return null;
            if (s === 'true') return true;
            if (s === 'false') return false;
            if (s.startsWith('[') || s.startsWith('{')) {
              try {
                return JSON.parse(s);
              } catch (e) {
                return val;
              }
            }
            return val;
          };

          // convert localized numeric strings (comma/dot) into Numbers for numeric fields
          try {
            for (const k of (this.groups.numbers || [])) {
              const v = this.settings[k];
              if (v === null || v === undefined || v === '') continue;
              if (typeof v === 'string') {
                const n = this.parseLocalizedNumber(v);
                if (n !== null) this.settings[k] = n;
              } else if (typeof v !== 'number') {
                const n = this.parseLocalizedNumber(String(v));
                if (n !== null) this.settings[k] = n;
              }
            }
          } catch (e) {
            console.error('Error parsing numeric fields', e);
          }

          // convert string-like fields
          try {
            for (const k of (this.groups.strings || [])) {
              this.settings[k] = tryParseFlexible(this.settings[k]);
            }
            for (const k of (this.groups.others || [])) {
              this.settings[k] = tryParseFlexible(this.settings[k]);
            }
          } catch (e) {
            console.error('Error parsing flexible strings', e);
          }

          const response = await fetch('{{ url_for("update_settings") }}', {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(this.settings),
          });

          if (response.ok) {
            const data = await response.json();
            showAlert("Settings updated successfully", "success", 5000);
            this.settings = data.settings || this.settings;
            this.buildGroups();
          } else {
            showAlert("Error updating settings", "error", 5000);
          }
        } catch (error) {
          showAlert("Error updating settings", "error", 5000);
          console.error("Error updating settings:", error);
        } finally {
          this.saving = false;
        }
      },

      prettifyJson(key) {
        try {
          const parsed = JSON.parse(this.jsonEditors[key] || 'null');
          this.jsonEditors[key] = JSON.stringify(parsed, null, 2);
        } catch (e) {
          showAlert("Invalid JSON", "error", 3000);
        }
      },

      formatLabel(key) {
        return key
          .split("_")
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
          .join(" ");
      },
    };
  }
</script>
